<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naveen Raj's LIC AAO Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>LIC AAO 2026/2027 Generalist Sprint</h1>
            <div class="progress-container">
                <div class="progress-stats">
                    <span id="days-completed">0</span> / 100 Days Completed
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
            <div class="strategy-banner">
                <strong>Critical Rule:</strong> Prelims has absolutely NO negative marking. The 30-mark English section is strictly qualifying; your merit is decided purely on the 70 marks from Quant and Reasoning.
            </div>
        </header>

        <main id="timeline-container">
            <!-- Day cards generated by JS -->
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
